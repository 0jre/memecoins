[project]
name = "memecoins-mcp"
version = "0.1.0"
description = "MCP server for Solana memecoin creation by AI agents"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9.0,<2",
]

[project.scripts]
memecoins-mcp = "memecoins_mcp.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["memecoins_mcp*"]
